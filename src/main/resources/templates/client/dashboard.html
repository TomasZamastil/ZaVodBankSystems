<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZaVod Bank – Přehled</title>
    <link rel="stylesheet" th:href="@{/css/zavod.css}"/>
    <style>
        .acc-card { cursor:pointer; transition: border-color 0.2s, transform 0.15s; }
        .acc-card:hover { border-color: rgba(201,168,76,0.5); transform: translateY(-2px); }
        .acc-card a.card-link { position:absolute; inset:0; border-radius:12px; }
        .acc-card { position:relative; }
    </style>
</head>
<body>
<nav>
    <div class="brand"><div class="brand-icon">Z</div><span class="brand-name">ZaVod Bank</span></div>
    <span class="nav-sec">Klient</span>
    <a href="/dashboard" class="nav-link active">Přehled účtů</a>
    <a href="/profile" class="nav-link">Profil</a>
    <div th:if="${isEmployee}">
        <span class="nav-sec">Zaměstnanec</span>
        <a href="/clientOverview" class="nav-link">Klienti</a>
        <a href="/employeeOverview" class="nav-link">Zaměstnanci</a>
        <a href="/clientCreation" class="nav-link">Nový klient</a>
        <a href="/accountManagement" class="nav-link">Správa účtů</a>
        <a href="/employeeManagement" class="nav-link">Správa zaměstnanců</a>
        <a href="/salaryManagement" class="nav-link">Mzdy</a>
    </div>
    <div th:if="${isManager}">
        <span class="nav-sec">Management</span>
        <a href="/managementOverview" class="nav-link">Přehled managementu</a>
    </div>
    <div class="nav-bottom"><a href="/logout" class="nav-link">Odhlásit se</a></div>
</nav>
<main>
    <h1>Dobrý den, <span th:text="${client.name}">Klient</span></h1>
    <p class="sub">Přehled vašich účtů</p>

    <div class="grid" th:if="${not #lists.isEmpty(accounts)}">
        <div class="acc-card" th:each="a : ${accounts}">
            <a th:href="@{/account/{id}(id=${a.idAccount})}" class="card-link" aria-label="Detail účtu"></a>
            <div class="acc-header">
                <span class="acc-type" th:text="${a.accountType.accountTypeName}">Typ</span>
                <span class="badge" th:classappend="${a.activeStatus} ? 'badge-on' : 'badge-off'"
                      th:text="${a.activeStatus} ? 'Aktivní' : 'Neaktivní'">Stav</span>
            </div>
            <div class="balance" th:classappend="${a.balance.signum() < 0} ? 'neg'"
                 th:text="${#numbers.formatDecimal(a.balance,1,'COMMA',2,'POINT')} + ' Kč'">0 Kč</div>
            <div class="acc-id" th:text="'Účet č. ' + ${a.idAccount}">Účet č. 1</div>
            <div class="acc-foot">
                <span th:text="'Úrok: ' + ${a.interest} + ' %'">0 %</span>
            </div>
        </div>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(accounts)}">
        <h3>Žádné účty</h3>
        <p>K vašemu profilu nejsou přiřazeny žádné účty.</p>
    </div>
</main>
</body>
</html>
