<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZaVod Bank – Přihlášení</title>
    <link rel="stylesheet" th:href="@{/css/zavod.css}"/>

</head>
<body class="login-page">

    <div class="login-brand">
        <div class="login-brand-icon">Z</div>
        <span class="login-brand-name">ZaVod Bank</span>
    </div>

    <div class="login-box">
        <h2 class="login-title">Přihlášení</h2>
        <p class="login-subtitle">Zadejte své přihlašovací údaje</p>

        <div class="error-msg" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <div class="login-form-group">
                <label for="socialSecurityIco">Rodné číslo / IČO (bez lomítka)</label>
                <input type="text" id="socialSecurityIco" name="socialSecurityIco"
                       placeholder="např. 9001011234 nebo 12345678" required autocomplete="username"/>
            </div>
            <div class="login-form-group">
                <label for="password">Heslo</label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" required autocomplete="current-password"/>
            </div>
            <button type="submit" class="btn-login">Přihlásit se</button>
        </form>

        <p class="hint">Potíže s přihlášením? Kontaktujte svou pobočku.</p>
    </div>

</body>
</html>
