<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZaVod Bank – Profil</title>
    <link rel="stylesheet" th:href="@{/css/zavod.css}"/>

</head>
<body>
<nav>
    <div class="brand"><div class="brand-icon">Z</div><span class="brand-name">ZaVod Bank</span></div>
    <span class="nav-sec">Klient</span>
    <a href="/dashboard" class="nav-link ">Přehled účtů</a>
    <a href="/investments" class="nav-link">Úvěry a závazky</a>
    <a href="/profile" class="nav-link active">Profil</a>
    <div th:if="${isEmployee}">
        <span class="nav-sec">Zaměstnanec</span>
        <a href="/clientOverview" class="nav-link">Klienti</a>
        <a href="/employeeOverview" class="nav-link">Zaměstnanci</a>
        <a href="/clientCreation" class="nav-link">Nový klient</a>
    <a href="/loanCreation" class="nav-link">Nový úvěr</a>
        <a href="/accountManagement" class="nav-link">Správa účtů</a>
        <a href="/employeeManagement" class="nav-link">Správa zaměstnanců</a>
        <a href="/salaryManagement" class="nav-link">Mzdy</a>
    </div>
    <div th:if="${isManager}">
        <span class="nav-sec">Management</span>
        <a href="/managementOverview" class="nav-link">Přehled managementu</a>
    </div>
    <div class="nav-bottom"><a href="/dashboard" class="nav-link">Zpět na dashboard</a><a href="/logout" class="nav-link">Odhlásit se</a></div>
</nav>
<main>
    <h1>Profil</h1>
    <div class="card">
        <div class="row"><span class="lbl">Jméno</span><span class="val" th:text="${client.name}">–</span></div>
        <div class="row"><span class="lbl">Rodné číslo / IČO</span><span class="val" th:text="${client.socialSecurityIco}">–</span></div>
        <div class="row"><span class="lbl">E-mail</span><span class="val" th:text="${client.email} ?: '–'">–</span></div>
        <div class="row"><span class="lbl">Telefon</span><span class="val" th:text="${client.phone} ?: '–'">–</span></div>
        <div class="row" th:if="${client.address != null}">
            <span class="lbl">Adresa</span>
            <span class="val" th:text="${client.address.street} + ' ' + ${client.address.buildingNumber} + ', ' + ${client.address.city}">–</span>
        </div>
    </div>
</main>
</body>
</html>
