<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZaVod Bank – Nový převod</title>
    <link rel="stylesheet" th:href="@{/css/zavod.css}"/>
</head>
<body>
<nav>
    <div class="brand"><div class="brand-icon">Z</div><span class="brand-name">ZaVod Bank</span></div>
    <span class="nav-sec">Klient</span>
    <a href="/dashboard" class="nav-link">Přehled účtů</a>
    <a href="/profile" class="nav-link">Profil</a>
    <div th:if="${isEmployee}">
        <span class="nav-sec">Zaměstnanec</span>
        <a href="/clientOverview" class="nav-link">Klienti</a>
        <a href="/employeeOverview" class="nav-link">Zaměstnanci</a>
        <a href="/clientCreation" class="nav-link">Nový klient</a>
        <a href="/accountManagement" class="nav-link">Správa účtů</a>
        <a href="/employeeManagement" class="nav-link">Správa zaměstnanců</a>
        <a href="/salaryManagement" class="nav-link">Mzdy</a>
    </div>
    <div th:if="${isManager}">
        <span class="nav-sec">Management</span>
        <a href="/managementOverview" class="nav-link">Přehled managementu</a>
    </div>
    <div class="nav-bottom"><a href="/logout" class="nav-link">Odhlásit se</a></div>
</nav>
<main>
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:0.3rem;">
        <a th:href="@{/account/{id}(id=${sourceAccount.idAccount})}"
           class="btn" style="padding:0.4rem 0.8rem;font-size:0.82rem;">← Zpět</a>
        <h1>Nový převod</h1>
    </div>
    <p class="sub" th:text="'Z: ' + ${sourceAccount.accountType.accountTypeName} + ' č.' + ${sourceAccount.idAccount} + '  —  Zůstatek: ' + ${#numbers.formatDecimal(sourceAccount.balance,1,'COMMA',2,'POINT')} + ' Kč'">Z účtu</p>

    <div class="alert alert-err" th:if="${error}" th:text="${error}"></div>

    <div class="card" style="max-width:480px;">
        <form th:action="@{/transfer}" method="post">
            <input type="hidden" name="sourceAccountId" th:value="${sourceAccount.idAccount}"/>
            <div class="form-group">
                <label>Číslo cílového účtu</label>
                <input type="text" name="destinationAccountId" placeholder="např. 5" required
                       pattern="[0-9]+" title="Zadejte číslo účtu"/>
            </div>
            <div class="form-group">
                <label>Částka (Kč)</label>
                <input type="text" name="amount" placeholder="např. 1000.00" required
                       pattern="[0-9]+([.,][0-9]{1,2})?" title="Zadejte částku"/>
            </div>
            <div class="form-group">
                <label>Variabilní symbol</label>
                <input type="text" name="variableSymbol" placeholder="např. 1234567"
                       pattern="[0-9]+" title="Zadejte variabilní symbol"/>
            </div>
            <button type="submit" class="btn btn-full">Odeslat převod</button>
        </form>
    </div>
</main>
</body>
</html>
