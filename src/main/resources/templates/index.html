<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZaVod Bank Systems</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="container">
    <div class="logo">ZV</div>

    <div class="status-badge" th:text="${status}">System Status</div>

    <h1 th:text="${title}">ZaVod Bank</h1>

    <p>Welcome to the ZaVod internal management portal. This system is now running on Spring Boot 3.4.0 with Thymeleaf integration.</p>

    <div class="action-box">
        <button class="btn" onclick="alert('Accessing secure vault...')">
            Open Dashboard
        </button>
    </div>

    <div class="footer-note">
        &copy; 2026 ZaVod Bank Systems Global. All rights reserved.
    </div>

</html>
