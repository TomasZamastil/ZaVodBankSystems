<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZaVod Bank – Klienti</title>
    <link rel="stylesheet" th:href="@{/css/zavod.css}"/>
    <style>
        .accounts-dropdown { display:none; margin-top:0.5rem; }
        .accounts-dropdown.open { display:block; }
        .acc-toggle { background:none; border:1px solid var(--border); color:var(--gold);
                      padding:0.2rem 0.6rem; border-radius:6px; font-size:0.8rem; cursor:pointer; }
        .acc-toggle:hover { background:rgba(201,168,76,0.1); }
        .acc-list { list-style:none; margin-top:0.4rem; display:flex; flex-direction:column; gap:0.3rem; }
        .acc-list li a { color:var(--off-white); font-size:0.82rem; text-decoration:none; }
        .acc-list li a:hover { color:var(--gold); }
    </style>
</head>
<body>
<nav>
    <div class="brand"><div class="brand-icon">Z</div><span class="brand-name">ZaVod Bank</span></div>
    <span class="nav-sec">Klient</span>
    <a href="/dashboard" class="nav-link">Přehled účtů</a>
    <a href="/investments" class="nav-link">Úvěry a závazky</a>
    <a href="/profile" class="nav-link">Profil</a>
    <span class="nav-sec">Zaměstnanec</span>
    <a href="/clientOverview" class="nav-link active">Klienti</a>
    <a href="/employeeOverview" class="nav-link">Zaměstnanci</a>
    <a href="/clientCreation" class="nav-link">Nový klient</a>
    <a href="/loanCreation" class="nav-link">Nový úvěr</a>
    <a href="/accountManagement" class="nav-link">Správa účtů</a>
    <a href="/employeeManagement" class="nav-link">Správa zaměstnanců</a>
    <a href="/salaryManagement" class="nav-link">Mzdy</a>
    <div th:if="${isManager}">
        <span class="nav-sec">Management</span>
        <a href="/managementOverview" class="nav-link">Přehled managementu</a>
    </div>
    <div class="nav-bottom">
        <a href="/dashboard" class="nav-link">Zpět na dashboard</a>
        <a href="/logout" class="nav-link">Odhlásit se</a>
    </div>
</nav>
<main>
    <h1>Přehled klientů</h1>
    <p class="sub" th:text="${#lists.size(clientRows)} + ' klientů celkem'">0</p>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Jméno</th>
                <th>RČ / IČO</th>
                <th>E-mail</th>
                <th>Telefon</th>
                <th>Město</th>
                <th>Účty</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="row : ${clientRows}">
                <td th:text="${row.idClient}">–</td>
                <td th:text="${row.name}">–</td>
                <td th:text="${row.socialSecurityIco}">–</td>
                <td th:text="${row.email} ?: '–'">–</td>
                <td th:text="${row.phone} ?: '–'">–</td>
                <td th:text="${row.address != null} ? ${row.address.city} : '–'">–</td>
                <td>
                    <!-- Jeden účet – stejný styl jako dropdown -->
                    <span th:if="${#lists.size(row.accounts) == 1}">
                        <a th:href="@{/account/{id}(id=${row.accounts[0].idAccount})}"
                           th:text="'č. ' + ${row.accounts[0].idAccount} + ' – ' + ${row.accounts[0].accountType.accountTypeName}"
                           class="acc-toggle" style="text-decoration:none;">–</a>
                    </span>
                    <!-- Žádný účet -->
                    <span th:if="${#lists.isEmpty(row.accounts)}" style="color:var(--muted);">–</span>
                    <!-- Více účtů – dropdown -->
                    <span th:if="${#lists.size(row.accounts) > 1}">
                        <button class="acc-toggle"
                                th:text="${#lists.size(row.accounts)} + ' účty'"
                                onclick="this.nextElementSibling.classList.toggle('open')">účty</button>
                        <div class="accounts-dropdown">
                            <ul class="acc-list">
                                <li th:each="acc : ${row.accounts}">
                                    <a th:href="@{/account/{id}(id=${acc.idAccount})}"
                                       th:text="'č. ' + ${acc.idAccount} + ' – ' + ${acc.accountType.accountTypeName} + ' (' + ${#numbers.formatDecimal(acc.balance,1,'COMMA',2,'POINT')} + ' Kč)'">–</a>
                                </li>
                            </ul>
                        </div>
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
