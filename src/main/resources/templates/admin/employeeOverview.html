<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZaVod Bank – Zaměstnanci</title>
    <link rel="stylesheet" th:href="@{/css/zavod.css}"/>

</head>
<body>
<nav>
    <div class="brand"><div class="brand-icon">Z</div><span class="brand-name">ZaVod Bank</span></div>
    <span class="nav-sec">Správa</span>
    <a href="/clientOverview" class="nav-link">Klienti</a>
    <a href="/employeeOverview" class="nav-link active">Zaměstnanci</a>
    <a href="/clientCreation" class="nav-link">Nový klient</a>
    <a href="/accountManagement" class="nav-link">Správa účtů</a>
    <a href="/employeeManagement" class="nav-link">Správa zaměstnanců</a>
    <a href="/salaryManagement" class="nav-link">Mzdy</a>
    <div class="nav-bottom">
        <a href="/dashboard" class="nav-link">Zpět na dashboard</a>
        <a href="/logout" class="nav-link">Odhlásit se</a>
    </div>
</nav>
<main>
    <h1>Přehled zaměstnanců</h1>
    <p class="sub" th:text="${#lists.size(employees)} + ' zaměstnanců celkem'">0 zaměstnanců</p>
    <table>
        <thead><tr><th>ID</th><th>Pozice</th><th>Základní plat</th><th>Bonus</th><th>Datum nástupu</th><th>Město</th></tr></thead>
        <tbody>
            <tr th:each="e : ${employees}">
                <td th:text="${e.idEmployee}">1</td>
                <td th:text="${e.position}">Pozice</td>
                <td th:text="${#numbers.formatDecimal(e.basePay,1,'COMMA',2,'POINT')} + ' Kč'">0 Kč</td>
                <td th:text="${e.bonus != null} ? ${#numbers.formatDecimal(e.bonus,1,'COMMA',2,'POINT')} + ' Kč' : '–'">–</td>
                <td th:text="${#temporals.format(e.hireDate,'dd.MM.yyyy')}">datum</td>
                <td th:text="${e.address != null} ? ${e.address.city} : '–'">–</td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
