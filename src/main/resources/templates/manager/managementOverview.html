<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZaVod Bank – Management</title>
    <link rel="stylesheet" th:href="@{/css/zavod.css}"/>

</head>
<body>
<nav>
    <div class="brand"><div class="brand-icon">Z</div><span class="brand-name">ZaVod Bank</span></div>
    <span class="nav-sec">Management</span>
    <a href="/managementOverview" class="nav-link active">Přehled</a>
    <a href="/clientOverview" class="nav-link">Klienti</a>
    <a href="/employeeOverview" class="nav-link">Zaměstnanci</a>
    <div class="nav-bottom">
        <a href="/dashboard" class="nav-link">Klientský portál</a>
        <a href="/logout" class="nav-link">Odhlásit se</a>
    </div>
</nav>
<main>
    <h1>Management Overview</h1>
    <p class="sub">Souhrn systému ZaVod Bank</p>

    <div class="stat-grid">
        <div class="stat-card">
            <div class="stat-label">Klientů</div>
            <div class="stat-value" th:text="${clientCount}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Účtů</div>
            <div class="stat-value" th:text="${accountCount}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Zaměstnanců</div>
            <div class="stat-value" th:text="${employeeCount}">0</div>
        </div>
    </div>

    <h2>Posledních 10 převodů</h2>
    <table>
        <thead><tr><th>Datum</th><th>Z účtu</th><th>Na účet</th><th>Částka</th><th>VS</th></tr></thead>
        <tbody>
            <tr th:each="t : ${recentTransfers}">
                <td th:text="${#temporals.format(t.transferDate,'dd.MM.yyyy HH:mm')}">datum</td>
                <td th:text="${t.sourceAccount.idAccount}">–</td>
                <td th:text="${t.destinationAccount.idAccount}">–</td>
                <td th:text="${#numbers.formatDecimal(t.amount,1,'COMMA',2,'POINT')} + ' Kč'">0 Kč</td>
                <td th:text="${t.variableSymbol}">–</td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
